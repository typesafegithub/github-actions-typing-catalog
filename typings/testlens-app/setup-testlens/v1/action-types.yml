# See https://github.com/typesafegithub/github-actions-typing
inputs:
  github-token:
    type: string

  instrumentation-version:
    type: string

  session-timeout-seconds:
    type: integer

  write-log-files:
    type: boolean

  working-directory:
    type: string

  use-oidc:
    type: boolean

  token-exchange-url:
    type: string
