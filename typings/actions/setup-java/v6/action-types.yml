# See https://github.com/typesafegithub/github-actions-typing
inputs:
  java-version:
    type: string
  distribution: &distribution
    type: enum
    allowed-values:
    - corretto
    - dragonwell
    - graalvm
    - graalvm-community
    - jetbrains
    - kona
    - liberica
    - liberica-nik
    - microsoft
    - oracle
    - oracle-openjdk
    - redhat
    - sapmachine
    - semeru
    - temurin
    - zulu
    - jdkfile
  java-package:
    type: enum
    allowed-values:
    - jdk
    - jre
    - jdk+fx
    - jre+fx
    - jdk+crac
    - jre+crac
    - jdk+jmods
    - jdk+jcef
    - jre+jcef
    - jdk+ft
    - jre+ft
  architecture:
    type: string
  jdkFile:
    type: string
  check-latest:
    type: boolean
  force-download:
    type: boolean
  server-id:
    type: string
  server-username:
    type: string
  server-password:
    type: string
  settings-path:
    type: string
  overwrite-settings:
    type: boolean
  gpg-private-key:
    type: string
  gpg-passphrase:
    type: string
  cache:
    type: enum
    name: BuildPlatform
    allowed-values:
    - maven
    - gradle
    - sbt
  job-status:
    type: string
  token:
    type: string
  mvn-toolchain-id:
    type: string
  mvn-toolchain-vendor:
    type: string
  cache-dependency-path:
    type: string
  java-version-file:
    type: string
  set-default:
    type: boolean
  verify-signature:
    type: boolean
  verify-signature-public-key:
    type: string
  show-download-progress:
    type: boolean
  jdk-file:
    type: string
  server-username-env-var:
    type: string
  server-password-env-var:
    type: string
  mvn-server-credentials:
    type: string
  mvn-repositories:
    type: list
    separator: "\n"
    list-item:
      type: string
  mvn-repositories-include-central:
    type: boolean
  mvn-repositories-prioritize-central:
    type: boolean
  cache-jdk:
    type: boolean
  cache-path:
    type: string
  cache-read-only:
    type: boolean
  gpg-passphrase-env-var:
    type: string
  problem-matcher:
    type: boolean

outputs:
  distribution: *distribution
  version:
    type: string
  path:
    type: string
  cache-hit:
    type: boolean
  cache-primary-key:
    type: string
